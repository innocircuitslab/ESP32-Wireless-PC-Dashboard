<text x="70" y="70" class="title">ESP32-S3 Wireless PC Dashboard — Exact Wiring</text>
<text x="70" y="108" class="sub">Component-side view • USB-C at bottom • Matches the final GPIO mapping used in the working build</text>
<g filter="url(#shadow)"><rect x="90" y="190" rx="22" width="450" height="540" fill="#b91c1c" stroke="#7f1d1d" stroke-width="4"/><rect x="135" y="235" width="340" height="450" rx="10" fill="#071827" stroke="#94a3b8" stroke-width="5"/><text x="155" y="282" class="boardtitle">2.4&quot; ILI9341 TFT</text></g><circle cx="540" cy="255" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="261" text-anchor="end" class="pin" fill="#fff">VCC</text><circle cx="540" cy="305" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="311" text-anchor="end" class="pin" fill="#fff">GND</text><circle cx="540" cy="355" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="361" text-anchor="end" class="pin" fill="#fff">CS</text><circle cx="540" cy="405" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="411" text-anchor="end" class="pin" fill="#fff">RST</text><circle cx="540" cy="455" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="461" text-anchor="end" class="pin" fill="#fff">DC/RS</text><circle cx="540" cy="505" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="511" text-anchor="end" class="pin" fill="#fff">SDI/MOSI</text><circle cx="540" cy="555" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="561" text-anchor="end" class="pin" fill="#fff">SCK</text><circle cx="540" cy="605" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="611" text-anchor="end" class="pin" fill="#fff">LED/BL</text><circle cx="540" cy="655" r="9" fill="#f8fafc" stroke="#7f1d1d" stroke-width="3"/><text x="522" y="661" text-anchor="end" class="pin" fill="#fff">SDO/MISO</text><text x="124" y="764" class="small">9-pin display header shown on the right</text><g filter="url(#shadow)"><rect x="760" y="180" rx="28" width="330" height="720" fill="#111827" stroke="#334155" stroke-width="5"/><rect x="865" y="325" width="120" height="250" rx="16" fill="#1f2937" stroke="#64748b" stroke-width="3"/><text x="925" y="285" text-anchor="middle" class="boardtitle">ESP32-S3</text><text x="925" y="315" text-anchor="middle" class="boardtitle" font-size="18">SuperMini</text><rect x="865" y="856" width="120" height="60" rx="14" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/><rect x="887" y="874" width="76" height="22" rx="9" fill="#334155"/><text x="925" y="948" text-anchor="middle" class="pin">USB-C</text></g><circle cx="760" cy="250" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="256" class="pin" fill="#f8fafc">GPIO8</text><circle cx="760" cy="315" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="321" class="pin" fill="#f8fafc">GPIO9</text><circle cx="760" cy="380" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="386" class="pin" fill="#f8fafc">GPIO10</text><circle cx="760" cy="445" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="451" class="pin" fill="#f8fafc">GPIO11</text><circle cx="760" cy="510" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="516" class="pin" fill="#f8fafc">GPIO12</text><circle cx="760" cy="575" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="581" class="pin" fill="#f8fafc">GPIO13</text><circle cx="760" cy="640" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="646" class="pin" fill="#f8fafc">3V3</text><circle cx="760" cy="705" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="711" class="pin" fill="#f8fafc">GND</text><circle cx="760" cy="770" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="778" y="776" class="pin" fill="#f8fafc">5V</text><circle cx="1090" cy="250" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="256" text-anchor="end" class="pin" fill="#f8fafc">GPIO7</text><circle cx="1090" cy="315" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="321" text-anchor="end" class="pin" fill="#f8fafc">GPIO6</text><circle cx="1090" cy="380" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="386" text-anchor="end" class="pin" fill="#f8fafc">GPIO5</text><circle cx="1090" cy="445" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="451" text-anchor="end" class="pin" fill="#f8fafc">GPIO4</text><circle cx="1090" cy="510" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="516" text-anchor="end" class="pin" fill="#f8fafc">GPIO3</text><circle cx="1090" cy="575" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="581" text-anchor="end" class="pin" fill="#f8fafc">GPIO2</text><circle cx="1090" cy="640" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="646" text-anchor="end" class="pin" fill="#f8fafc">GPIO1</text><circle cx="1090" cy="705" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="711" text-anchor="end" class="pin" fill="#f8fafc">RX</text><circle cx="1090" cy="770" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/><text x="1072" y="776" text-anchor="end" class="pin" fill="#f8fafc">TX</text><text x="925" y="992" text-anchor="middle" class="small">Physical pin order shown exactly for USB-at-bottom orientation</text><g filter="url(#shadow)"><rect x="1320" y="310" rx="24" width="330" height="360" fill="#e5e7eb" stroke="#64748b" stroke-width="5"/><circle cx="1490" cy="415" r="78" fill="#cbd5e1" stroke="#64748b" stroke-width="5"/><circle cx="1490" cy="415" r="48" fill="#94a3b8"/><text x="1485" y="525" text-anchor="middle" class="pin">ROTARY ENCODER</text><text x="1485" y="552" text-anchor="middle" class="small">EC11-style, 5 pins</text></g><circle cx="1320" cy="400" r="10" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1338" y="406" class="pin">A</text><circle cx="1320" cy="460" r="10" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1338" y="466" class="pin">COM</text><circle cx="1320" cy="520" r="10" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1338" y="526" class="pin">B</text><circle cx="1320" cy="595" r="10" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1338" y="601" class="pin">SW2</text><circle cx="1320" cy="645" r="10" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1338" y="651" class="pin">SW1</text><path d="M 540 355 H 610 V 250 H 760" stroke="#f59e0b" class="wire"/><path d="M 540 405 H 630 V 315 H 760" stroke="#f97316" class="wire"/><path d="M 540 455 H 650 V 380 H 760" stroke="#a855f7" class="wire"/><path d="M 540 505 H 670 V 445 H 760" stroke="#06b6d4" class="wire"/><path d="M 540 555 H 690 V 510 H 760" stroke="#3b82f6" class="wire"/><path d="M 540 605 H 710 V 575 H 760" stroke="#22c55e" class="wire"/><path d="M 540 255 H 575 V 640 H 760" stroke="#ef4444" class="wire"/><path d="M 540 305 H 595 V 705 H 760" stroke="#111827" class="wire"/><line x1="530" y1="655" x2="572" y2="655" stroke="#94a3b8" stroke-width="5" stroke-dasharray="8 8"/><text x="585" y="661" class="pin" fill="#64748b">NC</text><path d="M 1090 445 H 1180 V 400 H 1320" stroke="#eab308" class="wire"/><path d="M 1090 380 H 1200 V 520 H 1320" stroke="#14b8a6" class="wire"/><path d="M 1090 315 H 1220 V 595 H 1320" stroke="#ec4899" class="wire"/><path d="M 760 705 H 730 V 865 H 1260 V 460 H 1320" stroke="#111827" class="wire"/><text x="1120" y="850" class="wirelabel">GND → COM</text><path d="M 1260 460 V 645 H 1320" stroke="#111827" class="wire"/><text x="1270" y="625" class="wirelabel">GND → SW1</text><g transform="translate(80,820)">
<rect x="0" y="0" width="560" height="185" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
<text x="24" y="38" class="pin">Final GPIO mapping</text>
<text x="24" y="72" class="small">TFT: CS 8 • RST 9 • DC 10 • MOSI 11 • SCK 12 • BL 13</text>
<text x="24" y="104" class="small">Encoder: A 4 • B 5 • SW 6 • COM/SW1 → GND</text>
<text x="24" y="136" class="small">TFT VCC → 3V3 • TFT GND → GND • MISO not connected</text>
<text x="24" y="166" class="small">Use the printed pin labels on your modules; wire colors are not standardized.</text>
</g></svg>