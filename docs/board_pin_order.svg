<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="100%" height="100%" fill="#f8fafc"/><style>.t{font:700 34px Arial;fill:#0f172a} .s{font:20px Arial;fill:#475569} .p{font:700 21px Consolas;fill:#0f172a} .in{font:700 20px Consolas;fill:white}</style><text x="60" y="55" class="t">ESP32-S3 SuperMini — Physical Pin Order Used in This Build</text><text x="60" y="88" class="s">Component side • USB-C at bottom • same orientation as the finished dashboard</text><rect x="430" y="100" width="340" height="660" rx="28" fill="#111827" stroke="#334155" stroke-width="5"/><text x="600.0" y="150" text-anchor="middle" class="in">ESP32-S3 SuperMini</text><circle cx="430" cy="180" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="187" text-anchor="end" class="p">GPIO8</text><circle cx="430" cy="240" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="247" text-anchor="end" class="p">GPIO9</text><circle cx="430" cy="300" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="307" text-anchor="end" class="p">GPIO10</text><circle cx="430" cy="360" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="367" text-anchor="end" class="p">GPIO11</text><circle cx="430" cy="420" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="427" text-anchor="end" class="p">GPIO12</text><circle cx="430" cy="480" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="487" text-anchor="end" class="p">GPIO13</text><circle cx="430" cy="540" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="547" text-anchor="end" class="p">3V3</text><circle cx="430" cy="600" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="607" text-anchor="end" class="p">GND</text><circle cx="430" cy="660" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="402" y="667" text-anchor="end" class="p">5V</text><circle cx="770" cy="180" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="187" class="p">GPIO7</text><circle cx="770" cy="240" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="247" class="p">GPIO6</text><circle cx="770" cy="300" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="307" class="p">GPIO5</text><circle cx="770" cy="360" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="367" class="p">GPIO4</text><circle cx="770" cy="420" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="427" class="p">GPIO3</text><circle cx="770" cy="480" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="487" class="p">GPIO2</text><circle cx="770" cy="540" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="547" class="p">GPIO1</text><circle cx="770" cy="600" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="607" class="p">RX</text><circle cx="770" cy="660" r="10" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><text x="798" y="667" class="p">TX</text><rect x="540" y="735" width="120" height="55" rx="12" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/><rect x="565" y="752" width="70" height="20" rx="8" fill="#334155"/><text x="600.0" y="832" text-anchor="middle" class="p">USB-C</text><text x="120" y="815" class="s">TFT uses left-side GPIO8–GPIO13 plus 3V3/GND. Encoder uses right-side GPIO4/GPIO5/GPIO6 plus GND.</text></svg>